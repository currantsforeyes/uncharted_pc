name: tests

# The fork's own guard rail: the Python side (launcher, run.py, preparation scripts, the tests
# that read the C tables) on every push, on both platforms. The C build needs MSYS2 clang, the
# Vulkan SDK and the GPU submodules, so it stays a local step for now.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow
      - name: Run the tests
        run: python -m unittest discover -s tests -q
