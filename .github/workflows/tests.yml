name: tests

# The fork's own guard rail: the Python side (launcher, run.py, preparation scripts, the tests
# that read the C tables) on every push on both platforms, and the C tests under the MSYS2 CLANG64
# toolchain that builds the Windows package. Neither needs a GPU or game files.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow
      - name: Run the tests
        run: python -m unittest discover -s tests -q

  c-tests-win:
    name: C tests (Windows / MSYS2 CLANG64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-ffmpeg
      - name: Build and run the C tests
        run: bash tests/build.sh
